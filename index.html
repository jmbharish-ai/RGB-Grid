<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>RGB Grid</title>
        <style>
            body{
                background-color: white;
                text-align: center;
                
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
            }
            .changed{
                width: 200px; height: 100px;
                background-color: white; color: black;
                text-align: center; font-size: 80px; font-family: Arial, Helvetica, sans-serif;
                border: 5px solid black; border-radius: 0px;
            }
            #display{
                width: 400px; height: 100px;
                background-color: white; color: black;
                text-align: center; font-size: 80px; font-family: Arial, Helvetica, sans-serif;
                border: 5px solid black; border-radius: 0px;
            }
            .square{
                width: 30px; height: 30px;
                background-color: white; color: black;
                text-align: center; font-size: 0px; font-family: Arial, Helvetica, sans-serif;
                border: 5px solid black; border-radius: 0px;

                margin: 5px;
                line-height: 30px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <input id="blue" class="changed" type="number">
        <br>
        <button id="display" onclick="display()">Display</button>
        <br>
        <script>
            const blueInput=document.getElementById("blue");

            var nextAdd=5;
            for(var red=0; red<=255; red+=nextAdd){
                for(var green=0; green<=255; green+=nextAdd){
                    var square=document.createElement("label");
                    document.body.appendChild(square);
                    square.id=red+", "+green;
                    square.className="square";
                }
                var br=document.createElement("br");
                document.body.appendChild(br);
            }

            function display(){
                const blue=Number(blueInput.value);
                for(var red=0; red<=255; red+=nextAdd){
                    for(var green=0; green<=255; green+=nextAdd){
                        document.getElementById(red+", "+green).style.backgroundColor="rgb("+red+", "+green+", "+blue+")";
                    }
                }
            }
        </script>
    </body>
</html>
